name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      CI: 'true'
      GAUGE_TEST_SHARD: ${{ matrix.shard }}/5
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds must commit both edition.json and sources.lock.json.
        if: ${{ hashFiles('edition.json', 'sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - name: Install Chromium and system libraries
        # Base 144aa3f: the runner's Azure mirror can have a dead package path. Attempt 1 uses it; attempts 2 and 3 switch to
        # other mirrors serving the same Ubuntu-signed archive. Keep this list in step with apt_fallback_mirrors in Base's
        # scripts/agent-bootstrap.sh.
        run: |
          mirrors=(http://azure.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu http://us-east-1.ec2.archive.ubuntu.com/ubuntu)
          for attempt in 1 2 3; do
            mirror=${mirrors[attempt - 1]}
            sudo sed -i -E "s@^(URIs:[[:space:]]*)https?://(([a-z0-9.-]+\.)?archive\.ubuntu\.com|security\.ubuntu\.com|mirrors\.edge\.kernel\.org)/ubuntu/?@\1${mirror}/@" /etc/apt/sources.list.d/ubuntu.sources
            printf 'Chromium apt: attempt %s/3 (mirror %s)\n' "$attempt" "$mirror"
            if timeout --kill-after=5s 240s pnpm exec playwright install --with-deps chromium; then exit 0; fi
            # The timeout stops Playwright, not the root apt-get it started, which would still hold the dpkg lock for the next attempt.
            sudo kill -9 $(pidof apt-get dpkg 2>/dev/null) 2>/dev/null || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
            sudo dpkg --configure -a || true
            if (( attempt < 3 )); then sleep "$((attempt * 2))"; fi
          done
          printf 'Chromium apt: failed after 3 attempts\n' >&2
          exit 1
      - run: pnpm run verify

  verify:
    name: verify
    runs-on: ubuntu-24.04
    needs: checks
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: Require every verification shard
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
